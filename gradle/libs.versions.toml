[versions]
# Align with morphe-patches-template (Compatibility / Manager display names). Hold the patcher
# at the version the stable Morphe Manager bundles: a newer pin trips the manager's
# Patcher-Version gate and it refuses the bundle. Stable Manager 2.5.0 bundles 2.3.0, and so do
# morphe-desktop and the CLI 2.1.1. Patcher 2.3.0 went stable on 2026-11-06: smali stays at
# ac700e1942, ARSCLib moves to 675bed2de3, and patch() replaces the typed patch builders.
morphe-patcher = "2.3.0"
# First stable Manager release that bundled the patcher above. Nothing reads it since the release
# fact check went (9f6217088), so the README's install step and the bug form have to match by hand.
manager-floor = "2.5.0"
# Read by the app.morphe.patches settings plugin, not by anything in this repo: remove it and
# configuration fails with "Version with alias smali not found in version catalog". The commit
# resolves as com.github.MorpheApp.smali through JitPack. It is not waiting on an official
# release, which google/smali 3.0.10 delivered on 2026-08-20: the pin has to match whatever the
# patcher above was built against (2.3.0, 2.2.0, 2.1.0 and 2.0.1 ask for ac700e1942, 2.0.0 asked for 4220ae75f7), because
# a mismatch puts two copies of dexlib2 on the R8 classpath and buildAndroid fails with
# "Classpath type already present".
#noinspection GradleDependency
smali = "ac700e1942"
# The Android Gradle plugin and Kotlin come from the app.morphe.patches settings plugin
# (2.0.0 brings AGP 9.1.0 and Kotlin 2.4.21); nothing here pins them.
annotation = "1.10.0"
gson = "2.15.0"
# LAME as pure Java, LGPL 2.1 or later. Shipped inside the extension for the MP3 sound format; the
# 1.0.5 jar and pom were checked against the SHA-1 Maven Central serves before their SHA-256 went
# into verification-metadata.xml. Class files are Java 6, well under the bundle's Java 17 ceiling.
jump3r = "1.0.5"
# Every com.google.guava:guava request in this build is rewritten to this, on the settings
# classpath (settings.gradle.kts spells it out) and in every project graph (build.gradle.kts).
# CVE-2026-102554 (google/guava's repository advisory GHSA-xxph-c9ww-hj94, which GitHub's
# global advisory database didn't carry as of 2026-10-23) covers 4.0 to 33.7.1:
# CompactHashMap, CompactHashSet and MapMaker deserialization sized its arrays from the
# stream, so 72 bytes could ask for gigabytes. 33.7.2 (2026-09-29) is the fix. The graphs asked for 32.0.1, 33.3.1, 33.5.0,
# 33.6.0 and this pin's old 33.7.1. Build and patching classpath only: no Guava reaches TikTok.
# CVE-2026-118042 (GHSA-v5x9-67m3-7m56, low, 2026-10-31) then covered 13.0 to 33.7.2: HashBiMap
# and LinkedHashMultimap built from attacker-chosen keys went quadratic. 33.8.0 is its fix, and
# moves error_prone_annotations from 2.50.0 to 2.52.0; failureaccess, jspecify and j2objc stay.
guava = "33.8.0-jre"
# Every io.netty request on Netty's main release train is rewritten to this in every project
# graph (build.gradle.kts); netty-tcnative versions on its own train and is left alone. Only the
# Android plugin's unified test platform asks for Netty here: its core asked for 4.1.93 and its
# emulator control for 4.1.110, and both sit inside GHSA-c4c3-7fpv-j4q5 (netty-handler SNI
# routing, critical, fixed in 4.1.137) plus dozens of netty-codec-http and netty-codec-http2
# advisories. GitHub's advisory database listed none for 4.1.137 to 4.1.139 on 2026-11-08.
# 4.1.139 (2026-10-06) is the newest 4.1 release more than two weeks old then. Nothing here
# reaches TikTok.
netty = "4.1.139.Final"
# Every org.bouncycastle request in this build is rewritten to this, in :extensions:tiktok's
# test graph and in :patches' build graph. It has to be a version that publishes all three
# modules: 1.85.2 is a bcprov-only patch release, so forcing bcpkix and bcutil to it resolved
# nothing and the dependency report said FAILED while the build still succeeded. 1.86
# (2026-09-11) publishes bcprov, bcpkix and bcutil, and sits outside seven advisories:
# CVE-2025-8916 (1.44 to 1.78), CVE-2026-5588 (1.67 to 1.83, apart from the 1.80.2 and
# 1.81.1 maintenance releases), CVE-2025-14813 and CVE-2026-0636 (both fixed in 1.84),
# CVE-2026-8763 and CVE-2026-13506 (both fixed in 1.85), and CVE-2026-97873 (the provider's
# PBE and PKCS#12 key derivation, everything before 1.86). 1.86 is the first release outside
# that last one, which is why 1.85.x would not do even with all three modules. The patcher's
# own 1.77 is inside all seven; the Android build tools' 1.79 is outside CVE-2025-8916 but
# inside the other six.
bouncycastle = "1.86"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jump3r = { module = "de.sciss:jump3r", version.ref = "jump3r" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
android-library = { id = "com.android.library" }
